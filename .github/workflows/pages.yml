name: Deploy GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Build bundled WpApp asset
        shell: bash
        run: |
          set -euo pipefail

          work_dir="$(mktemp -d)"
          runtime_dir="$work_dir/runtime"
          archive_path="$work_dir/wp-app.zip"

          curl -L --fail --silent --show-error \
            https://codeload.github.com/akirk/wp-app/zip/refs/heads/main \
            --output "$archive_path"

          unzip -q "$archive_path" -d "$work_dir/source"
          source_dir="$(find "$work_dir/source" -mindepth 1 -maxdepth 1 -type d | head -n 1)"

          mkdir -p "$runtime_dir/src/templates" wizard/assets
          cp "$source_dir/LICENSE" "$runtime_dir/LICENSE"
          cp "$source_dir/README.md" "$runtime_dir/README.md"
          cp "$source_dir/composer.json" "$runtime_dir/composer.json"
          cp "$source_dir/src/BaseStorage.php" "$runtime_dir/src/BaseStorage.php"
          cp "$source_dir/src/abstract-baseapp.php" "$runtime_dir/src/abstract-baseapp.php"
          cp "$source_dir/src/class-masterbar.php" "$runtime_dir/src/class-masterbar.php"
          cp "$source_dir/src/class-registry.php" "$runtime_dir/src/class-registry.php"
          cp "$source_dir/src/class-router.php" "$runtime_dir/src/class-router.php"
          cp "$source_dir/src/class-settings.php" "$runtime_dir/src/class-settings.php"
          cp "$source_dir/src/class-wpapp.php" "$runtime_dir/src/class-wpapp.php"
          cp "$source_dir/src/functions.php" "$runtime_dir/src/functions.php"
          cp "$source_dir/src/templates/403.php" "$runtime_dir/src/templates/403.php"
          cp "$source_dir/src/templates/404.php" "$runtime_dir/src/templates/404.php"

          ( cd "$runtime_dir" && zip -qr "$GITHUB_WORKSPACE/wizard/assets/wp-app.zip" . )

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: wizard

      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
